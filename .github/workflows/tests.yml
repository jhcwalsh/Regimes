name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Data-dependent tests (app smoke, exhibit replication) skip themselves when
      # the parquet cache is absent, so this runs offline with no FRED key.
      - run: python -m pytest -q
