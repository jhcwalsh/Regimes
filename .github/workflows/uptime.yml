name: uptime

# Daily check that the public app answers. A failure here emails the repo owner,
# which is the only alerting the unattended Mac mini has.
on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: regimes.lazyeconomist.com answers 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://regimes.lazyeconomist.com/)
          echo "HTTP $code"
          test "$code" = "200"
