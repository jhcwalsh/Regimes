[theme]
base = "light"
primaryColor = "#b8410e"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f4f2ec"
textColor = "#1a1a1a"
font = "serif"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Public site: show only the exception type, never a stack trace (full detail stays in the logs)
showErrorDetails = "type"
